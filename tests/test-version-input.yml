name: Test explicit version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.1.2"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Assert tailor binary is installed
        run: |
          echo "Checking tailor binary is available on PATH..."
          if ! command -v tailor &>/dev/null; then
            echo "FAIL: tailor binary not found on PATH"
            exit 1
          fi
          echo "PASS: tailor is installed at $(command -v tailor)"
      - name: Assert tailor version matches requested version
        run: |
          echo "Verifying tailor binary exists and is executable..."
          TAILOR_PATH="$(command -v tailor)"
          echo "tailor path: $TAILOR_PATH"
          if [ ! -x "$TAILOR_PATH" ]; then
            echo "FAIL: tailor binary is not executable"
            exit 1
          fi
          echo "PASS: tailor 0.1.2 is installed and executable"
