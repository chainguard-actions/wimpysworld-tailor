name: Test tailor docket subcommand
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock curl
        run: |
          MOCK_DIR="$RUNNER_TEMP/mock-bin"
          mkdir -p "$MOCK_DIR"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl" "$MOCK_DIR/curl"
          chmod +x "$MOCK_DIR/curl"
          echo "$MOCK_DIR" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          version: "0.1.1"
          docket: "true"
          fit: "false"
          alter: "false"
          baste: "false"
          measure: "false"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Assert tailor binary is installed after docket
        run: |
          echo "Checking tailor is on PATH after docket run..."
          if ! command -v tailor &>/dev/null; then
            echo "FAIL: tailor not found on PATH"
            exit 1
          fi
          echo "tailor found at: $(command -v tailor)"
          echo "PASS: tailor docket completed and binary is present"
